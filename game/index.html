<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HEXCLASH</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0b0b18;
    color: #e8e8f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  #wrap {
    max-width: 480px;
    width: 100%;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: #0b0b18;
  }
  #hud {
    flex: 0 0 auto;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    background: #141428;
    border-bottom: 1px solid #26264a;
    font-size: 14px;
    line-height: 1.2;
  }
  #hud button {
    font: inherit;
    color: #e8e8f2;
    background: #23234a;
    border: 1px solid #3a3a6e;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #hud button:active { background: #2e2e5e; }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas#game {
    display: block;
    touch-action: manipulation;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    background: #101024;
  }
  footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 6px 8px 10px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #8a8ab0;
  }
  button { font: inherit; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hud"></div>
    <div id="stage">
      <canvas id="game" width="390" height="700"></canvas>
    </div>
    <footer>HEXCLASH &mdash; auto battler &bull; tap to play</footer>
  </div>
  <script src="src/logic.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
